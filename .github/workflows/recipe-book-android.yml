name: recipe-book (Android)

# apps/recipe-book/android の変更があったときだけ動く。
# - check: ユニットテスト（JVM。速い）・Lint・デバッグ APK のビルド
# - publish-dev-build: main へのプッシュのとき、動作確認用のデバッグ APK を GitHub のリリース（プレリリース）に置く
on:
  push:
    branches: [main]
    paths:
      - 'apps/recipe-book/android/**'
      - '.github/workflows/recipe-book-android.yml'
  pull_request:
    paths:
      - 'apps/recipe-book/android/**'
      - '.github/workflows/recipe-book-android.yml'
  workflow_dispatch:

concurrency:
  group: recipe-book-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: テストとビルド
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/recipe-book/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: ユニットテスト（ドメイン・データ・アプリ）
        run: ./gradlew :domain:test :data:test :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      # ビルドの番号（この実行の番号とコミット）を、アプリのバージョンの表示に入れる。どのビルドを試しているかを、設定の画面で見分けるため
      - name: デバッグ APK をビルド
        run: ./gradlew :app:assembleDebug -PbuildLabel="${{ github.run_number }}-${GITHUB_SHA::7}" --stacktrace

      - name: ビルドした APK の大きさ
        run: ls -l app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: recipe-book-debug-apk
          path: apps/recipe-book/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 失敗したときのレポート
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            apps/recipe-book/android/**/build/reports/
            apps/recipe-book/android/**/build/test-results/
          retention-days: 7

  publish-dev-build:
    name: 開発ビルドを配布
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: recipe-book-debug-apk
          path: apk

      - name: 開発ビルドのリリース（プレリリース）を更新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp apk/app-debug.apk recipe-book-debug.apk
          gh release delete recipe-book-dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create recipe-book-dev recipe-book-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "recipe-book 開発ビルド" \
            --notes "main の最新（${GITHUB_SHA::7}）から自動でビルドした、動作確認用のデバッグ版です。公開版ではありません。"
